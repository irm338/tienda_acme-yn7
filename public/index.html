<!doctype html>
<html lang="es">
<head>
  <!-- Define codificación, vista adaptable y recursos compartidos de la página. -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Interfaz para consultar y administrar el catálogo de productos ACME.">
  <title>Gestión de productos | Tienda ACME</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <main class="container">
    <!-- El formulario sirve para registrar productos y reutilizarse al editarlos. -->
    <h1>Gestión de productos</h1>
    <section class="card" aria-labelledby="form-title">
      <h2 id="form-title">Agregar producto</h2>
      <form id="product-form">
        <div class="form-grid">
          <div class="form-group">
            <label for="codigo">Código</label>
            <input id="codigo" name="codigo" type="text" required>
          </div>
          <div class="form-group">
            <label for="nombre">Nombre</label>
            <input id="nombre" name="nombre" type="text" required>
          </div>
          <div class="form-group">
            <label for="precio">Precio</label>
            <input id="precio" name="precio" type="number" step="0.01" min="0" required>
          </div>
          <div class="form-group checkbox-group">
            <input id="activo" name="activo" type="checkbox" checked>
            <label for="activo">Activo</label>
          </div>
          <div class="form-group full-width">
            <label for="descripcion">Descripción</label>
            <textarea id="descripcion" name="descripcion"></textarea>
          </div>
        </div>
        <div class="button-row">
          <button type="submit" class="button button-primary" id="save-button">Guardar</button>
          <button type="button" class="button button-secondary" id="cancel-button" hidden>
            Cancelar edición
          </button>
        </div>
      </form>
      <!-- Anuncia resultados y errores sin interrumpir la navegación por teclado. -->
      <p id="status-message" class="status-message" role="status" aria-live="polite"></p>
    </section>

    <!-- La tabla se completa desde GET /productos y se actualiza tras cada operación. -->
    <section class="card" aria-labelledby="list-title">
      <h2 id="list-title">Lista de productos</h2>
      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th scope="col">Código</th>
              <th scope="col">Nombre</th>
              <th scope="col">Descripción</th>
              <th scope="col">Precio</th>
              <th scope="col">Estado</th>
              <th scope="col">Acciones</th>
            </tr>
          </thead>
          <tbody id="product-list"></tbody>
        </table>
      </div>
    </section>
  </main>
</body>
</html>
